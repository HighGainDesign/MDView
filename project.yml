name: MDView
options:
  bundleIdPrefix: design.highgain
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: UX8BPNLPX5
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 9
    ENABLE_DEBUG_DYLIB: NO
packages:
  Apex:
    url: https://github.com/ApexMarkdown/apex.git
    exactVersion: 1.1.34
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.9
targets:
  MDView:
    type: application
    platform: macOS
    sources:
      - App
      - path: LICENSE
        buildPhase: resources
      - path: Integrations/Drafts/Preview in MDView.draftsAction
        buildPhase: resources
      - path: Shared
        excludes: [Resources]
      - path: Shared/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MDView
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: text/markdown
        CFBundleURLTypes:
          - CFBundleURLName: Markdown preview
            CFBundleURLSchemes: [mdview]
    entitlements:
      path: App/MDView.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [UX8BPNLPX5.design.highgain.mdview]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.highgain.mdview
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Apex
        product: ApexC
      - package: SwiftSoup
      - target: MDViewQuickLook
        embed: true
  MDViewQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - QuickLook
      - path: LICENSE
        buildPhase: resources
      - path: Shared
        excludes: [Resources]
      - path: Shared/Resources
        buildPhase: resources
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: MDView Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [net.daringfireball.markdown]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: true
    entitlements:
      path: QuickLook/QuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups: [UX8BPNLPX5.design.highgain.mdview]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.highgain.mdview.quicklook
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Apex
        product: ApexC
      - package: SwiftSoup
  MDViewTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: MDView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.highgain.mdview.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MDView:
    build:
      targets:
        MDView: all
    test:
      targets: [MDViewTests]
      environmentVariables:
        MDVIEW_TEST_PREFERENCES: '1'
